# clipboard (OSC 52)
set -g set-clipboard on

# Tell tmux how to set the outer clipboard even when the outer TERM is a plain
# xterm-256color (plain ssh) that has no `Ms` in its terminfo. `*` matches any TERm
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# appearance 
set -g status-bg cyan
set -g window-status-style bg=yellow
set -g window-status-current-style bg=red,fg=white

# Truecolor + italics
set -ga terminal-overrides ',xterm-256color:Tc:sitm=\E[3m'
set -ga terminal-overrides ',xterm-kitty:Tc:sitm=\E[3m'

# keys / copy mode
set -g mouse on
setw -g mode-keys vi

# leave copy mode
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# responsiveness 
set -g repeat-time 0
set -s escape-time 10

# Let nvim's FocusLost autocmd fire (used for autosave).
set -g focus-events on

# environment
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_CLIENT SSH_TTY WINDOWID XAUTHORITY KITTY_PID KITTY_LISTEN_ON KITTY_WINDOW_ID KITTY_IS_REMOTE"
